<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKC 3D Portal</title>
    <link rel="icon" type="image/jpeg" href="/images/kkc_logo.jpg">
    <link rel="stylesheet" href="/css/viewer.css">
</head>
<body>
    <div id="top-ui">
        <div id="menu-container">
            <div id="job-info" class="ui-panel">
                <button id="menu-btn" title="Menu" aria-label="Menu" aria-expanded="false" class="menu-btn-style">&#9776;</button>
                <span>Job: <span id="job-code-display">...</span></span>
            </div>

            <div id="dropdown-menu" class="ui-panel">
                <div id="room-info" class="room-info-style">
                    Current Room: <b id="room-name-display" class="room-name-style">...</b>
                </div>

                <div id="room-switcher" class="room-switcher-style">
                    <label class="slider-label">Switch Room:</label>
                    <div id="room-list-ui" class="room-list-ui-style"></div>
                </div>

                <div>
                    <label for="sens-slider" class="slider-label">Sensitivity: <span id="sens-val">1.00</span></label>
                    <input type="range" id="sens-slider" min="0.1" max="3" step="0.1" value="1.0">
                </div>

                <a href="/" class="logout-btn">Log Out / Change Job</a>
            </div>
        </div>

        <button id="help-btn" class="ui-panel" aria-label="Help">?</button>
    </div>

    <div id="status">Initializing 3D...</div>

    <div id="help-modal">
        <div class="modal-content">
            <button id="close-help-x" class="close-help" aria-label="Close help">&times;</button>
            <h3 class="controls-title">Controls</h3>
            <div class="controls-body">
                <b>Rotate:</b> Left Click / 1 Finger Drag<br>
                <b>Pan:</b> Right Click / 2 Finger Drag<br>
                <b>Zoom:</b> Scroll / Use Right Joystick<br>
                <b>Pivot:</b> Double Click to center rotation
            </div>
            <button id="close-help-btn" class="close-help-btn-style">Got it</button>
        </div>
    </div>

    <!-- Zoom Joystick -->
    <div id="joystick-container">
        <div id="joystick-track"></div>
        <div id="joystick-handle"></div>
        <div class="joystick-label">Zoom</div>
    </div>

    <button id="camera-btn" title="Render Photo" aria-label="Take Photo">
        <div class="camera-inner">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-camera">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
        </div>
    </button>

    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="/js/viewer.js?v=70"></script>
</body>
</html>
