<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKC Showroom - Part Tagger</title>
    <link rel="icon" type="image/jpeg" href="/images/kkc_logo.jpg">
<link rel="stylesheet" href="/css/tagger.css?v=300">
</head>
<body>
    <div id="sidebar">
        <h2>Part Tagger</h2>

        <!-- Mode Tabs -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="staging">Staging</button>
            <button class="mode-tab" data-mode="category">Category</button>
        </div>

        <!-- Staging Mode -->
        <div id="staging-panel" class="mode-panel active">
            <p class="sidebar-hint">Load a staged GLB, auto-parse by part type, configure targets, then split &amp; deploy.</p>
            <div class="sidebar-section">
                <label>Staged Files:</label>
                <select id="sel-staging-file">
                    <option value="">-- Select --</option>
                </select>
            </div>
            <button id="btn-load-staging" class="btn-primary">Load Staged GLB</button>

            <div id="staging-actions" style="display:none">
                <hr>
                <!-- Context + Style -->
                <div class="sidebar-section">
                    <label>Context:</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-context="kitchen" id="ctx-kitchen">Kitchen</button>
                        <button class="toggle-btn" data-context="island" id="ctx-island">Island</button>
                    </div>
                </div>
                <div class="sidebar-section">
                    <label>Style:</label>
                    <select id="sel-staging-style">
                        <option value="face_frame">Face Frame</option>
                        <option value="full_inset">Full Inset</option>
                        <option value="frameless">Frameless</option>
                    </select>
                </div>
                <!-- Overlay (face_frame only) -->
                <div class="sidebar-section" id="overlay-section" style="display:none">
                    <label>Overlay:</label>
                    <select id="sel-staging-overlay">
                        <option value="full_overlay">Full Overlay</option>
                        <option value="half_overlay">Half Overlay</option>
                    </select>
                </div>

                <button id="btn-auto-parse" class="btn-primary btn-parse">Auto-Parse by Name</button>

                <div id="parse-summary" style="display:none">
                    <h3>Parse Summary</h3>
                    <div id="parse-counts"></div>
                </div>

                <div class="tag-legend" id="staging-legend"></div>

                <!-- Per-category settings: shown after parse -->
                <div id="category-settings" style="display:none">
                    <hr>
                    <p class="sidebar-hint" style="margin-bottom:8px">Configure destination for each detected category:</p>
                    <div id="category-rows"></div>
                </div>

                <div class="sidebar-section" style="margin-top:12px">
                    <label>Output Name:</label>
                    <input type="text" id="staging-output-name" placeholder="e.g. shaker" class="text-input">
                </div>

                <button id="btn-split-deploy" class="btn-primary btn-save">Split &amp; Deploy</button>
            </div>
        </div>

        <!-- Category Mode -->
        <div id="category-panel" class="mode-panel">
            <p class="sidebar-hint">Load and re-tag meshes for a specific showroom path.</p>

            <!-- Context -->
            <div class="sidebar-section">
                <label>Context:</label>
                <select id="cat-sel-context">
                    <option value="kitchen">Kitchen</option>
                    <option value="island">Island</option>
                </select>
            </div>
            <!-- Style -->
            <div class="sidebar-section">
                <label>Style:</label>
                <select id="cat-sel-style">
                    <option value="face_frame">Face Frame</option>
                    <option value="full_inset">Full Inset</option>
                    <option value="frameless">Frameless</option>
                </select>
            </div>
            <!-- Overlay (face_frame only) -->
            <div class="sidebar-section" id="cat-overlay-section" style="display:none">
                <label>Overlay:</label>
                <select id="cat-sel-overlay">
                    <option value="full_overlay">Full Overlay</option>
                    <option value="half_overlay">Half Overlay</option>
                </select>
            </div>
            <!-- Category -->
            <div class="sidebar-section">
                <label>Category:</label>
                <select id="cat-sel-category"></select>
            </div>
            <!-- Sub-category -->
            <div class="sidebar-section" id="cat-subcategory-section" style="display:none">
                <label>Sub-Category:</label>
                <select id="cat-sel-subcategory"></select>
            </div>
            <!-- Grain (slab doors only) -->
            <div class="sidebar-section" id="cat-grain-section" style="display:none">
                <label>Grain:</label>
                <select id="cat-sel-grain">
                    <option value="horizontal">Horizontal</option>
                    <option value="vertical">Vertical</option>
                </select>
            </div>
            <!-- File -->
            <div class="sidebar-section">
                <label>File:</label>
                <select id="sel-file">
                    <option value="">-- Select --</option>
                </select>
            </div>
            <button id="btn-load" class="btn-primary">Load GLB</button>

            <div id="category-actions" style="display:none">
                <hr>
                <div class="tag-legend">
                    <span class="legend-item"><span class="dot tagged"></span> Tagged</span>
                    <span class="legend-item"><span class="dot ignore"></span> Ignore</span>
                    <span class="legend-item"><span class="dot untagged"></span> Untagged</span>
                </div>
                <div class="tag-stats" id="tag-stats"></div>
                <button id="btn-save" class="btn-primary btn-save">Save Tags</button>
            </div>
        </div>

        <!-- Shared Controls -->
        <div id="shared-controls" style="display:none">
            <hr>
            <div class="shared-footer">
                <label class="toggle-label">
                    <input type="checkbox" id="chk-show-hidden">
                    Show Hidden
                </label>
                <span id="mesh-count" class="mesh-count-badge"></span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Click Popup -->
    <div id="mesh-popup" style="display:none">
        <div class="popup-header">
            <span class="popup-name"></span>
            <button class="popup-close">&times;</button>
        </div>
        <div class="popup-current-tag"></div>
        <div class="popup-actions"></div>
    </div>

    <div id="status"><span id="status-text">Select a file to begin</span></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
<script type="module" src="/js/tagger.js?v=300"></script>
</body>
</html>
